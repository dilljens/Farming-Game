# Farming Game static frontend (replaces nginx:alpine's default site).
# HTML entry points are never cached — versioning rides on the ?v= tags in
# index.html, so a stale entry page would pin clients to deleted assets
# (this exact failure killed every button after the .mjs -> .js rename).
# Anything else revalidates via ETag; mime.types still comes from the main
# nginx.conf at http level.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
