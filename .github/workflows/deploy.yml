name: Deploy farm.ferrumeng.com

# Push-to-deploy: every main push carrying game files syncs the VPS copy
# that https://farm.ferrumeng.com serves (see backend/AI_BACKEND.md §5.1),
# so the live site can never drift behind GitHub again.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts.js'
      - 'styles.css'
      - 'backend.js'
      - 'game-time.js'
      - 'pricing.js'
      - 'manifest.json'
      - 'icon-*.svg'
      - 'vendor/**'
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  # Manual redeploy from the Actions tab (runs everything unconditionally).
  workflow_dispatch:

# Deploys run one at a time, never cancelled mid-rsync.
concurrency:
  group: deploy-farm
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'index.html'
              - 'scripts.js'
              - 'styles.css'
              - 'backend.js'
              - 'game-time.js'
              - 'pricing.js'
              - 'manifest.json'
              - 'icon-*.svg'
              - 'vendor/**'
            backend:
              - 'backend/**'

  # node --check skips validation for .js files containing import/export
  # (silently passes!), so check copies under a .mjs name plus the unit
  # tests. Deploy jobs wait on this — a broken file never ships.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check browser modules
        run: |
          cp scripts.js /tmp/scripts.check.mjs && node --check /tmp/scripts.check.mjs
          cp pricing.js /tmp/pricing.check.mjs && node --check /tmp/pricing.check.mjs
      - name: Unit tests
        run: node --test pricing.test.js game-time.test.js

  deploy-frontend:
    needs: [changes, validate]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FARMING_DEPLOY_KEY }}
      - name: Rsync game files to VPS
        run: |
          # Cache-buster tokens ride the commit SHA: every deploy gets fresh
          # ?v= URLs, so phones can never pin stale code. Working copy only
          # (never committed back — that would loop the pipeline).
          TOKEN=$(git rev-parse --short HEAD)
          sed -i -E "s/(\.(js|css)\?v=)[0-9a-z]+/\1$TOKEN/g" index.html scripts.js
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          rsync -avz -e "ssh -o StrictHostKeyChecking=accept-new" \
            index.html scripts.js styles.css backend.js game-time.js pricing.js \
            manifest.json icon-192.svg icon-512.svg vendor \
            ubuntu@40.160.241.74:/opt/farming-game/
      - name: Verify live version matches repo
        run: |
          sleep 5
          live_token=$(curl -s --max-time 20 https://farm.ferrumeng.com/ | grep -o 'scripts\.js?v=[0-9a-z]*' | head -n 1)
          echo "deploy: scripts.js?v=$TOKEN live: $live_token"
          test -n "$live_token" && test "scripts.js?v=$TOKEN" = "$live_token"

  deploy-backend:
    needs: [changes, validate]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FARMING_DEPLOY_KEY }}
      - name: Rsync backend and re-run stack
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=accept-new" \
            backend/ ubuntu@40.160.241.74:/opt/farming-backend/
          ssh -o StrictHostKeyChecking=accept-new ubuntu@40.160.241.74 \
            'cd /opt/farming-backend && ./backend-up.sh'
